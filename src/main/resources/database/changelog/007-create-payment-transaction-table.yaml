databaseChangeLog:
  - changeSet:
      id: 007-create-payment-transaction-table
      author: max
      changes:

        - createSequence:
            sequenceName: payment_transaction_id_seq
            startValue: 1

        - createTable:
            tableName: payment_transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: initiator_user_id
                  type: BIGINT

              - column:
                  name: message_id
                  type: BIGINT

              - column:
                  name: change_money_rub
                  type: "NUMERIC(10,4)"        # кавычки не обязательны в блочном стиле,
                  # но оставим — так надёжнее
                  constraints:
                    nullable: false

              - column:
                  name: input_tokens
                  type: INTEGER

              - column:
                  name: total_tokens
                  type: INTEGER

              - column:
                  name: cost
                  type: "NUMERIC(10,4)"

              - column:
                  name: cost_commission
                  type: "NUMERIC(10,4)"

              - column:
                  name: type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: date_create
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            constraintName: fk_pt_user
            baseTableName: payment_transaction
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_pt_initiator_user
            baseTableName: payment_transaction
            baseColumnNames: initiator_user_id
            referencedTableName: app_user
            referencedColumnNames: id
            onDelete: SET NULL

        - addForeignKeyConstraint:
            constraintName: fk_pt_message
            baseTableName: payment_transaction
            baseColumnNames: message_id
            referencedTableName: message
            referencedColumnNames: id
            onDelete: SET NULL

        - createIndex:
            indexName: idx_pt_user
            tableName: payment_transaction
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_pt_message
            tableName: payment_transaction
            columns:
              - column:
                  name: message_id
